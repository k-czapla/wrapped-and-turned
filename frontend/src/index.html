<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Wrapped and Turned</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!--
    Backend base URL for production deployments where frontend and backend are on different origins.
    This placeholder is replaced at build time by `scripts/inject-backend-url.mjs`.
    When empty, the app falls back to same-origin paths (local dev proxy or shared-domain hosting).
  -->
  <meta name="wt-backend-url" content="__WT_BACKEND_URL__">
  <!--
    Feature toggle for Wrapped page. Replaced at build time; "true" or "1" = show Wrapped, otherwise hidden.
  -->
  <meta name="wt-feature-wrapped" content="__WT_FEATURE_WRAPPED__">
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
