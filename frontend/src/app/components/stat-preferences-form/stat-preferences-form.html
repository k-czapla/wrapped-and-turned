<div class="flex flex-col gap-3">
  @for (key of keys; track key) {
    <label
      class="flex cursor-pointer items-center justify-between gap-4 rounded-xl border border-slate-200 bg-white px-4 py-3 shadow-sm transition hover:border-slate-300"
      [class.pointer-events-none]="disabled()"
      [class.opacity-70]="disabled()"
    >
      <span class="text-sm font-medium text-slate-800">{{ labels[key] }}</span>
      <button
        type="button"
        role="switch"
        [attr.aria-checked]="prefs()[key]"
        [attr.aria-label]="labels[key] + (prefs()[key] ? ' on' : ' off')"
        (click)="toggle(key); $event.preventDefault()"
        [disabled]="disabled() || saving()"
        class="relative inline-flex h-6 w-11 shrink-0 rounded-full border border-slate-300 transition-colors focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 disabled:opacity-50"
        [class.bg-indigo-600]="prefs()[key]"
        [class.bg-slate-200]="!prefs()[key]"
      >
        <span
          class="pointer-events-none inline-block h-5 w-5 transform rounded-full bg-white shadow ring-0 transition"
          [class.translate-x-5]="prefs()[key]"
          [class.translate-x-0.5]="!prefs()[key]"
        ></span>
      </button>
    </label>
  }
</div>
