<div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
  <div class="flex flex-wrap items-end justify-between gap-4">
    <div>
      <h2 class="text-xl font-bold text-slate-900">Pattern Round Up</h2>
      <p class="mt-1 text-sm text-slate-600">
        Select a bundle from your Ravelry Favorites to generate pattern boards and a video description.
      </p>
    </div>
    <div class="flex flex-wrap items-center gap-3">
      @if (bundlesLoading) {
        <span class="text-sm text-slate-500">Loading your bundles…</span>
      } @else if (bundles.length > 0) {
        <select
          (change)="onBundleChange($event)"
          [disabled]="loadPatternsLoading"
          class="rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm text-slate-700 focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500"
          aria-label="Select a bundle"
        >
          <option value="">Select a bundle…</option>
          @for (b of bundles; track b.id) {
            <option [value]="b.id">
              {{ b.name ?? 'Bundle ' + b.id }}{{ b.pattern_count != null ? ' (' + b.pattern_count + ')' : '' }}
            </option>
          }
        </select>
      }
    </div>
  </div>
  @if (loadPatternsLoading) {
    <p class="mt-4 text-sm text-slate-500">Loading pattern details…</p>
  }
  @if (error()) {
    <app-error-alert [message]="error()!" class="mt-4" />
  }
</div>
