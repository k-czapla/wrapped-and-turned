<div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
  <div class="flex items-center justify-between gap-3">
    <div class="text-sm font-semibold text-slate-900">Preview</div>
    <a routerLink="/board-design" class="text-sm font-medium text-indigo-600 hover:text-indigo-700 hover:underline"
      >Customize board design</a
    >
  </div>

  @if (cardsLoading()) {
    <p class="mt-4 text-sm text-slate-500">Loading project details…</p>
  } @else if (cards().length === 0) {
    <p class="mt-4 text-sm text-slate-500">Select one or more projects to generate a visualisation.</p>
  } @else {
    <div class="mt-4 flex flex-col gap-6">
      @for (card of cards(); track card.id; let i = $index) {
        <div class="flex flex-col items-center gap-3">
          <div
            #board
            class="overflow-hidden border border-slate-200 bg-white shadow-sm"
style="width: var(--board-width);"
          >
            <app-assistant-board-card [card]="card" [design]="design()" [displayOptions]="displayOptions()" />
          </div>
          <button
            type="button"
            (click)="downloadBoard(i)"
            class="rounded-lg bg-gradient-to-r from-indigo-600 to-rose-600 px-4 py-2 text-sm font-semibold text-white hover:opacity-90"
          >
            Download PNG
          </button>
        </div>
      }
    </div>
  }
</div>
