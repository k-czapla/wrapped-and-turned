<div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
  <div class="flex items-center justify-between gap-3">
    <div>
      <div class="text-sm font-semibold text-slate-900">Preview</div>
      <div class="mt-1 text-xs text-slate-500">Vertical board · 9:16-ish</div>
    </div>
    <button
      (click)="downloadBoard()"
      [disabled]="!card()"
      class="rounded-lg bg-gradient-to-r from-indigo-600 to-rose-600 px-4 py-2 text-sm font-semibold text-white disabled:opacity-50"
    >
      Download PNG
    </button>
  </div>

  <div class="mt-4 flex justify-center">
    <div
      #board
      class="w-[320px] overflow-hidden rounded-[28px] border border-slate-200 bg-white shadow-sm"
    >
      <app-assistant-board-card [card]="card()" />
    </div>
  </div>
</div>
