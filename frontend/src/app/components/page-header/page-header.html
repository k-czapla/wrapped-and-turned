<header class="sticky top-0 z-10 border-b border-slate-200/70 bg-white/70 backdrop-blur">
  <div class="mx-auto flex max-w-6xl items-center justify-between gap-4 px-4 py-3">
    <a routerLink="/" class="flex items-center gap-2">
      <div class="grid h-9 w-9 place-items-center rounded-xl bg-gradient-to-br from-indigo-500 to-rose-500 text-white">
        <span class="text-sm font-semibold">W&T</span>
      </div>
      <div class="leading-tight">
        <div class="text-sm font-semibold text-slate-900">Wrapped and Turned</div>
        <div class="text-xs text-slate-500">Your fiber arts year in stats</div>
      </div>
    </a>

    <nav *ngIf="(me$() | async) as me" class="hidden items-center gap-1 md:flex">
      @if (wrappedEnabled()) {
        <a
          routerLink="/wrapped"
          routerLinkActive="bg-slate-900 text-white"
          class="rounded-lg px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-100"
          >Wrapped</a
        >
      }
      <a
        routerLink="/assistant"
        routerLinkActive="bg-slate-900 text-white"
        class="rounded-lg px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-100"
        >Podcaster's Assistant</a
      >
    </nav>

    <div class="flex items-center gap-3">
      <ng-container *ngIf="(me$() | async) as me; else loggedOut">
        <div class="relative" data-user-menu>
          <button
            (click)="toggleUserMenu($event)"
            class="flex items-center gap-2 rounded-lg px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-100"
          >
            <span class="hidden sm:inline">Logged in as <span class="font-medium">{{ me.username }}</span></span>
            <span class="sm:hidden">{{ me.username }}</span>
            <svg
              class="h-4 w-4 text-slate-500 transition-transform"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              [class.rotate-180]="showUserMenu()"
            >
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
            </svg>
          </button>
          @if (showUserMenu()) {
            <div class="absolute right-0 top-full z-20 mt-2 w-56 rounded-lg border border-slate-200 bg-white shadow-lg" data-user-menu>
              <div class="py-1">
                <a
                  routerLink="/board-design"
                  routerLinkActive="bg-slate-50"
                  (click)="closeUserMenu()"
                  class="block px-4 py-2 text-sm text-slate-700 hover:bg-slate-50"
                >
                  Board design
                </a>
                @if (wrappedEnabled()) {
                  <a
                    routerLink="/stats-preferences"
                    routerLinkActive="bg-slate-50"
                    (click)="closeUserMenu()"
                    class="block px-4 py-2 text-sm text-slate-700 hover:bg-slate-50"
                  >
                    Stats Preferences
                  </a>
                }
                <button
                  (click)="logout.emit(); closeUserMenu()"
                  class="w-full px-4 py-2 text-left text-sm text-slate-700 hover:bg-slate-50"
                >
                  Log out
                </button>
              </div>
            </div>
          }
        </div>
      </ng-container>
      <ng-template #loggedOut>
        <button
          (click)="login.emit()"
          class="rounded-lg bg-gradient-to-r from-indigo-600 to-rose-600 px-3 py-2 text-sm font-semibold text-white hover:from-indigo-500 hover:to-rose-500"
        >
          Log in with Ravelry
        </button>
      </ng-template>
    </div>
  </div>
</header>
