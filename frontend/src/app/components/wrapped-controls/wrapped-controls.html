<div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
  <div class="flex flex-wrap items-end justify-between gap-4">
    <div>
      <h2 class="text-xl font-bold text-slate-900">Your Wrapped</h2>
      <p class="mt-1 text-sm text-slate-600">Pick a period, then generate stats and charts from your Ravelry projects.</p>
    </div>

    <div class="flex flex-wrap items-end gap-3">
      <label class="block">
        <div class="text-xs font-semibold text-slate-600">From</div>
        <input
          [ngModel]="from()"
          (ngModelChange)="onFromChange($event)"
          type="date"
          class="mt-1 rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm"
        />
      </label>
      <label class="block">
        <div class="text-xs font-semibold text-slate-600">To</div>
        <input
          [ngModel]="to()"
          (ngModelChange)="onToChange($event)"
          type="date"
          class="mt-1 rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm"
        />
      </label>
      <button
        (click)="onGenerate()"
        [disabled]="loading()"
        class="rounded-lg bg-slate-900 px-4 py-2 text-sm font-semibold text-white hover:bg-slate-800 disabled:opacity-50"
      >
        {{ loading() ? 'Generating…' : 'Generate' }}
      </button>
    </div>
  </div>

  @if (error()) {
    <div class="mt-4 rounded-xl border border-rose-200 bg-rose-50 px-4 py-3 text-sm text-rose-800">
      {{ error() }}
    </div>
  }

  <div class="mt-4 text-xs text-slate-500">
    Ideas for more stats (easy add-ons): top designers, yarn weights, most used yarn brands, average project duration,
    biggest project by yardage.
  </div>
</div>
