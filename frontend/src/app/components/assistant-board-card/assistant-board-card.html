<div class="assistant-board-card" [ngStyle]="cardStyle()">
  <div class="assistant-board-card__inner">
    <div class="assistant-board-card__brand">WRAPPED & TURNED</div>

    <div class="assistant-board-card__image-wrap">
      @if (card()?.imageUrl) {
        <img [src]="card()!.imageUrl" class="assistant-board-card__image" alt="" />
      } @else {
        <div class="assistant-board-card__image-placeholder"></div>
      }
    </div>

    <div class="assistant-board-card__title-block">
      <div class="assistant-board-card__title">{{ card()?.patternName ?? card()?.projectName }}</div>
      <div class="assistant-board-card__designer">{{ card()?.designerName ?? ' ' }}</div>
    </div>

    <div class="assistant-board-card__fields">
      <div class="assistant-board-card__field">
        <div class="assistant-board-card__field-label">PROJECT</div>
        <div class="assistant-board-card__field-value">{{ card()?.projectName ?? '—' }}</div>
      </div>
      <div class="assistant-board-card__field">
        <div class="assistant-board-card__field-label">SIZE</div>
        <div class="assistant-board-card__field-value">{{ card()?.sizeMade ?? '—' }}</div>
      </div>
      <div class="assistant-board-card__field">
        <div class="assistant-board-card__field-label">YARN</div>
        <div class="assistant-board-card__field-value">{{ card()?.yarnUsed ?? '—' }}</div>
      </div>
    </div>

    <div class="assistant-board-card__footer">
      <a
        href="https://wrapped-turned.onrender.com/"
        target="_blank"
        rel="noopener noreferrer"
        class="assistant-board-card__link"
        >wrapped-turned.onrender.com</a
      >
    </div>
  </div>
</div>
