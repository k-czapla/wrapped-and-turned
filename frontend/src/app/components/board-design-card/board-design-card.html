<button
  type="button"
  (click)="selectedChange.emit()"
  class="board-design-card"
  [class.board-design-card--selected]="selected()"
  [attr.aria-pressed]="selected()"
  aria-label="Select board design"
>
  <div class="board-design-card__preview">
    <app-assistant-board-card [card]="sampleCard" [design]="design()" />
  </div>
  @if (selected()) {
    <span class="board-design-card__check" aria-hidden="true">Selected</span>
  }
</button>
