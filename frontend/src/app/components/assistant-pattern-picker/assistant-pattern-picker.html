<div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
  <div class="flex items-center justify-between gap-3">
    <div>
      <div class="text-sm font-semibold text-slate-900">Pick patterns</div>
      <div class="mt-1 text-xs text-slate-500">Select the patterns you want to generate a board for.</div>
    </div>
    <div class="flex gap-2 text-xs">
      <button
        type="button"
        (click)="selectAll()"
        class="rounded-lg border border-slate-300 bg-white px-2 py-1.5 font-medium text-slate-700 hover:bg-slate-50"
      >
        Select all
      </button>
      <button
        type="button"
        (click)="clearSelection()"
        class="rounded-lg border border-slate-300 bg-white px-2 py-1.5 font-medium text-slate-700 hover:bg-slate-50"
      >
        Clear
      </button>
    </div>
  </div>

  <ul class="mt-4 max-h-80 list-none space-y-1 overflow-y-auto rounded-xl border border-slate-200 p-2" role="listbox" aria-multiselectable="true" aria-label="Patterns to include in visualisation">
    @for (p of patterns(); track p.id) {
      <li>
        <label class="flex cursor-pointer items-center gap-3 rounded-lg px-3 py-2 hover:bg-slate-50">
          <input
            type="checkbox"
            [checked]="isSelected(p.id)"
            (change)="toggle(p.id)"
            class="h-4 w-4 rounded border-slate-300 text-indigo-600 focus:ring-indigo-500"
            [attr.aria-label]="'Select ' + p.patternName"
          />
          <span class="text-sm text-slate-900">{{ p.patternName }}</span>
          @if (p.designerName) {
            <span class="text-xs text-slate-500">by {{ p.designerName }}</span>
          }
        </label>
      </li>
    }
  </ul>

  <div class="mt-4 text-xs text-slate-500">Tip: once you like a board, download it and use it in your show notes.</div>
</div>
