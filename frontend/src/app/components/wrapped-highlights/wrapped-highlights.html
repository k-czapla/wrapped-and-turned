<div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
  <div class="text-sm font-semibold text-slate-900">Highlights</div>
  <div class="mt-3 grid gap-3">
    <div class="flex items-center justify-between rounded-xl bg-slate-50 px-4 py-3">
      <div class="text-sm text-slate-700">Average duration</div>
      <div class="text-sm font-semibold text-slate-900">
        {{ highlights().avgDurationDays ?? '—' }}@if (highlights().avgDurationDays) {
          <span class="text-slate-500"> days</span>
        }
      </div>
    </div>
    <div class="flex items-center justify-between rounded-xl bg-slate-50 px-4 py-3">
      <div class="text-sm text-slate-700">Date range</div>
      <div class="text-sm font-semibold text-slate-900">{{ range().from }} → {{ range().to }}</div>
    </div>
  </div>
</div>
