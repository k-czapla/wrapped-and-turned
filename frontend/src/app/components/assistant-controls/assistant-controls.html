<div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
  <div class="flex flex-wrap items-end justify-between gap-4">
    <div>
      <h2 class="text-xl font-bold text-slate-900">Podcaster's Assistant</h2>
      <p class="mt-1 text-sm text-slate-600">
        Generate a vertical project board (perfect for podcast/IG stories) and download it as a PNG.
      </p>
    </div>

    <app-date-range-form
      [from]="from()"
      [to]="to()"
      buttonLabel="Load projects"
      loadingLabel="Loading…"
      [loading]="loading()"
      (fromChange)="onFromChange($event)"
      (toChange)="onToChange($event)"
      (submit)="onLoadProjects()"
    />
  </div>

  @if (error()) {
    <app-error-alert [message]="error()!" />
  }
</div>
