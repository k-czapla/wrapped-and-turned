<section class="flex flex-col gap-6">
  <app-wrapped-controls
    [from]="from"
    [to]="to"
    (fromChange)="from = $event"
    (toChange)="to = $event"
    [loading]="loading"
    [error]="error"
    (generate)="generate()"
  />

  @if (stats; as s) {
    <app-wrapped-totals [totals]="s.totals" />

    <div class="grid gap-4 md:grid-cols-2">
      <app-wrapped-craft-chart
        [chartData]="craftChartData"
        [chartOptions]="craftChartOptions"
        [mostProductiveMonth]="s.highlights.mostProductiveMonth"
      />
      <app-wrapped-highlights [highlights]="s.highlights" [range]="s.range" />
    </div>

    <app-wrapped-projects-gallery [projects]="s.projects" />
  }
</section>
