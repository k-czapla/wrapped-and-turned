<section class="flex flex-col gap-6">
  <app-assistant-controls
    [from]="from"
    [to]="to"
    (fromChange)="from = $event"
    (toChange)="to = $event"
    [loading]="loading"
    [error]="error"
    (loadProjects)="loadProjects()"
  />

  <app-assistant-board-options
    [options]="displayOptions"
    (optionsChange)="displayOptions = $event"
  />

  @if (wrapped; as w) {
    <app-assistant-generate-description
      [cards]="cards"
      [totalFinishedInRange]="w.totals?.finishedProjects ?? null"
    />

    <div class="grid gap-4 md:grid-cols-2">
      <app-assistant-project-picker
        [projects]="w.projects ?? []"
        [selectedIds]="selectedProjectIds"
        (selectionChange)="onSelectionChange($event)"
      />
      <app-assistant-board-preview
        [cards]="cardsWithUploadedPhotos"
        [cardsLoading]="cardsLoading"
        [design]="selectedDesign()"
        [displayOptions]="displayOptions"
        [photoSourceByProjectId]="photoSourceByProjectId"
        [selectedPhotoIndexByProjectId]="selectedPhotoIndexByProjectId"
        (photoSourceChange)="onPhotoSourceChange($event.projectId, $event.source)"
        (selectedPhotoIndexChange)="onSelectedPhotoIndexChange($event.projectId, $event.index)"
        (photoUpload)="onPhotoUpload($event.projectId, $event.dataUrl)"
      />
    </div>
    <app-assistant-thumbnail-generator
      [cards]="cardsWithUploadedPhotos"
      [uploadedPhotosByProjectId]="uploadedPhotosByProjectId"
    />
  }
</section>
