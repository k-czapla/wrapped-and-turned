<section class="flex flex-col gap-6">
  <app-assistant-controls
    [from]="from"
    [to]="to"
    (fromChange)="from = $event"
    (toChange)="to = $event"
    [loading]="loading"
    [error]="error"
    (loadProjects)="loadProjects()"
  />

  @if (wrapped; as w) {
    <div class="grid gap-4 md:grid-cols-2">
      <app-assistant-project-picker
        [projects]="w.projects"
        (projectSelect)="onSelectProject($event)"
      />
      <app-assistant-board-preview
        [card]="card"
        [selectedProjectId]="selectedProjectId"
      />
    </div>
  }
</section>
