name: Deploy (Render)

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      # Keep this job safe: it only triggers deploy after builds succeed.
      - name: Install backend deps
        run: npm ci --prefix backend

      - name: Build backend
        run: npm --prefix backend run build

      - name: Install frontend deps
        run: npm ci --prefix frontend

      - name: Build frontend
        run: npm --prefix frontend run build -- --output-path dist

      - name: Trigger Render backend deploy hook (optional)
        if: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK != '' }}
        env:
          HOOK: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}
        run: curl -fsSL -X POST "$HOOK"

      - name: Trigger Render frontend deploy hook (optional)
        if: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK != '' }}
        env:
          HOOK: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}
        run: curl -fsSL -X POST "$HOOK"

